<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Real Sports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#0A0A0A] text-white min-h-screen flex flex-col font-sans">
    <header class="bg-[#121212] border-b border-[#2D2D2D] h-16 flex items-center justify-between px-6">
        <h1 class="text-lg font-black uppercase italic text-[#FF6B00] flex items-center"><i class="fa-solid fa-shield-halved mr-2"></i> Painel de Administração</h1>
        <a href="index.html" class="bg-transparent border border-[#2D2D2D] text-xs font-bold px-3 py-1.5 rounded-lg hover:border-[#FF6B00] transition-colors">Voltar ao Site</a>
    </header>

    <main class="flex-1 p-6 max-w-6xl mx-auto w-full space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-[#1A1A1A] border border-[#2D2D2D] p-6 rounded-2xl shadow-xl">
                <span class="text-xs text-gray-400 uppercase font-bold">Estado do Sistema</span>
                <h3 class="text-2xl font-black text-emerald-500 mt-2">Ativo (Online)</h3>
            </div>
            <div class="bg-[#1A1A1A] border border-[#2D2D2D] p-6 rounded-2xl shadow-xl">
                <span class="text-xs text-gray-400 uppercase font-bold">Utilizador Atual</span>
                <h3 id="admin-email" class="text-sm font-bold text-white mt-3 truncate">A verificar...</h3>
            </div>
            <div class="bg-[#1A1A1A] border border-[#2D2D2D] p-6 rounded-2xl shadow-xl">
                <span class="text-xs text-gray-400 uppercase font-bold">Ações Rápidas</span>
                <button onclick="logoutAdmin()" class="mt-3 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-xs font-bold uppercase transition-colors cursor-pointer w-full">Terminar Sessão</button>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://eyikgikngskbbutuxuaj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5aWtnaWtuZ3NrYmJ1dHV4dWFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNDc1NjEsImV4cCI6MjEwODcyMzU2MX0.BszkQeKnrxb9PSA67K0uNzEagC2KLyDEDNYORPif5Fc';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                alert('Acesso negado. Faça login primeiro.');
                window.location.href = 'login.html';
                return;
            }

            const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();
            if (!profile || profile.role !== 'admin') {
                alert('Acesso restrito a administradores.');
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('admin-email').innerText = session.user.email;
        });

        async function logoutAdmin() {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
