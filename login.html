<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Real Sports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0A0A0A] text-white h-screen flex items-center justify-center p-4 font-sans">
    <div class="bg-[#1A1A1A] border border-[#2D2D2D] rounded-2xl p-8 w-full max-w-md shadow-2xl space-y-6">
        <div class="text-center">
            <span class="text-3xl font-black text-white tracking-wider uppercase flex items-center justify-center mb-2">
                <span class="bg-[#FF6B00] text-white px-3 py-1 rounded-lg mr-2 italic font-black shadow-lg">REAL</span>SPORTS
            </span>
            <p id="form-subtitle" class="text-xs text-gray-400">Aceda à sua conta para continuar</p>
        </div>

        <div id="auth-message" class="hidden text-xs p-3 rounded-xl text-center font-bold"></div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" class="w-full bg-[#0A0A0A] border border-[#2D2D2D] rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-[#FF6B00]">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">Palavra-passe</label>
                <input type="password" id="password" placeholder="••••••••" class="w-full bg-[#0A0A0A] border border-[#2D2D2D] rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-[#FF6B00]">
            </div>

            <button type="button" onclick="fazerLogin()" id="submit-btn" class="w-full bg-[#FF6B00] hover:bg-[#FF8533] text-white font-black py-3.5 rounded-xl uppercase text-xs tracking-wider transition-colors cursor-pointer shadow-lg">
                Entrar
            </button>

            <div class="flex justify-between items-center text-xs pt-2">
                <a href="index.html" class="text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left mr-1"></i> Voltar ao Início</a>
                <button type="button" onclick="alternarModo()" id="toggle-btn" class="text-[#FF6B00] font-bold hover:underline cursor-pointer">Criar conta nova</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://eyikgikngskbbutuxuaj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5aWtnaWtuZ3NrYmJ1dHV4dWFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNDc1NjEsImV4cCI6MjEwODcyMzU2MX0.BszkQeKnrxb9PSA67K0uNzEagC2KLyDEDNYORPif5Fc';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let registar = false;

        function alternarModo() {
            registar = !registar;
            document.getElementById('form-subtitle').innerText = registar ? 'Registe-se para começar a apostar' : 'Aceda à sua conta para continuar';
            document.getElementById('submit-btn').innerText = registar ? 'Cadastrar' : 'Entrar';
            document.getElementById('toggle-btn').innerText = registar ? 'Já tenho conta' : 'Criar conta nova';
            document.getElementById('auth-message').classList.add('hidden');
        }

        function avisar(texto, erro = true) {
            const m = document.getElementById('auth-message');
            m.innerText = texto;
            m.className = `text-xs p-3 rounded-xl text-center font-bold ${erro ? 'bg-red-500/20 text-red-500 border border-red-500/30' : 'bg-emerald-500/20 text-emerald-500 border border-emerald-500/30'}`;
            m.classList.remove('hidden');
        }

        async function fazerLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                avisar('Preencha o e-mail e a palavra-passe.');
                return;
            }

            if (registar) {
                avisar('A criar conta...', false);
                const { error } = await supabase.auth.signUp({ email, password });
                if (error) {
                    avisar('Erro: ' + error.message);
                } else {
                    avisar('Conta criada com sucesso! Já pode entrar.', false);
                    setTimeout(() => alternarModo(), 1500);
                }
            } else {
                avisar('A entrar...', false);
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    avisar('E-mail ou palavra-passe incorretos.');
                } else {
                    // Grava o estado no navegador para o index.html detetar o login imediatamente
                    localStorage.setItem('real_sports_logged', 'true');
                    localStorage.setItem('real_sports_email', email);

                    avisar('Login com sucesso! A redirecionar...', false);
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                }
            }
        }
    </script>
</body>
</html>
