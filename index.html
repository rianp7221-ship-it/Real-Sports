<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Sports - Plataforma de Apostas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { green: '#00E676', dark: '#0B0E14', card: '#151921', border: '#2A2E39' } } } }
        }
    </script>
</head>
<body class="bg-brand-dark text-white min-h-screen font-sans flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-brand-card border-b border-brand-border sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <span class="text-2xl font-black text-brand-green tracking-wider uppercase">REAL<span class="text-white">SPORTS</span></span>
            <div class="flex items-center space-x-3">
                <div id="user-logged-section" class="flex items-center space-x-3 hidden">
                    <div class="bg-brand-dark px-3 py-1.5 rounded-lg border border-brand-border flex items-center space-x-2">
                        <span class="text-xs text-gray-400">Saldo:</span>
                        <span id="user-balance" class="font-bold text-brand-green">R$ 0,00</span>
                    </div>
                    <button onclick="openDepositModal()" class="bg-brand-green text-black font-bold px-3 py-1.5 rounded-lg text-sm"><i class="fa-solid fa-wallet"></i> Depositar</button>
                    <button onclick="logout()" class="text-gray-400 hover:text-white p-2 text-sm"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
                <div id="user-guest-section" class="flex items-center space-x-2">
                    <button onclick="openAuthModal('login')" class="border border-brand-border text-white font-bold px-4 py-2 rounded-lg text-sm">Entrar</button>
                    <button onclick="openAuthModal('signup')" class="bg-brand-green text-black font-bold px-4 py-2 rounded-lg text-sm">Cadastrar</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Navegação -->
    <nav class="bg-brand-card/50 border-b border-brand-border">
        <div class="max-w-7xl mx-auto px-4 flex space-x-6 text-sm font-semibold">
            <button onclick="switchTab('sports')" class="py-3 text-brand-green border-b-2 border-brand-green flex items-center space-x-2"><i class="fa-solid fa-football"></i> Esportes</button>
            <button onclick="switchTab('mines')" class="py-3 text-gray-400 hover:text-white flex items-center space-x-2"><i class="fa-solid fa-bomb"></i> Mines</button>
        </div>
    </nav>

    <!-- Conteúdo Principal Dinâmico -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        <!-- Secção Esportes -->
        <section id="tab-sports" class="space-y-6">
            <div class="bg-gradient-to-r from-emerald-900/40 to-brand-card p-6 rounded-2xl border border-brand-border">
                <span class="bg-brand-green text-black font-black text-xs px-2 py-1 rounded uppercase">Destaques</span>
                <h2 class="text-2xl font-bold mt-2">Principais Partidas</h2>
            </div>
            <!-- A lista de jogos será injetada aqui pelo sports.js -->
            <div id="sports-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>

        <!-- Secção Mines -->
        <section id="tab-mines" class="hidden max-w-md mx-auto space-y-6">
            <div class="bg-brand-card p-6 rounded-2xl border border-brand-border text-center space-y-4">
                <h2 class="text-xl font-bold flex items-center justify-center space-x-2"><i class="fa-solid fa-bomb text-brand-green"></i> <span>Real Mines</span></h2>
                <!-- O tabuleiro será injetado aqui pelo mines.js -->
                <div id="mines-grid" class="w-full"></div> 
            </div>
        </section>
    </main>

    <!-- UI Modais -->
    <div id="betslip" class="fixed bottom-4 right-4 bg-brand-card border border-brand-border rounded-xl p-4 w-80 shadow-2xl hidden z-40">
        <div class="flex justify-between items-center border-b border-brand-border pb-2 mb-3"><span class="font-bold text-sm">Boletim</span><button onclick="closeBetSlip()"><i class="fa-solid fa-xmark"></i></button></div>
        <div id="betslip-content" class="mb-3 text-sm"></div>
        <div class="space-y-2 border-t border-brand-border pt-2">
            <div class="flex justify-between items-center text-xs text-gray-400"><span>Valor:</span><input type="number" id="bet-amount" value="10" oninput="updateBetReturn()" class="w-24 bg-brand-dark border border-brand-border rounded px-2 py-1 text-right text-white"></div>
            <div class="flex justify-between text-sm font-bold"><span>Retorno:</span><span id="bet-return" class="text-brand-green">R$ 0,00</span></div>
            <button onclick="placeBet()" class="w-full bg-brand-green text-black font-bold py-2 rounded-lg">Confirmar</button>
        </div>
    </div>

    <div id="deposit-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-brand-card border border-brand-border rounded-2xl p-6 w-full max-w-sm space-y-4">
            <div class="flex justify-between items-center"><h3 class="font-bold">Depósito</h3><button onclick="closeDepositModal()"><i class="fa-solid fa-xmark"></i></button></div>
            <input type="number" id="deposit-amount" value="50" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-white font-bold">
            <button onclick="simulateDeposit()" class="w-full bg-brand-green text-black font-bold py-2.5 rounded-lg">Confirmar Depósito</button>
        </div>
    </div>

    <div id="auth-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-brand-card border border-brand-border rounded-2xl p-6 w-full max-w-sm space-y-4">
            <div class="flex justify-between items-center"><h3 id="auth-title" class="font-bold text-lg">Entrar</h3><button onclick="closeAuthModal()"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="space-y-3">
                <div id="auth-name-container" class="hidden space-y-1"><label class="text-xs text-gray-400">Nome</label><input type="text" id="auth-name" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-white"></div>
                <div class="space-y-1"><label class="text-xs text-gray-400">E-mail</label><input type="email" id="auth-email" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-white"></div>
                <div class="space-y-1"><label class="text-xs text-gray-400">Senha</label><input type="password" id="auth-password" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-white"></div>
            </div>
            <button id="auth-submit-btn" onclick="submitAuth()" class="w-full bg-brand-green text-black font-bold py-2.5 rounded-lg">Entrar</button>
        </div>
    </div>

    <!-- Scripts da Arquitetura Modular -->
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sports.js"></script>
    <script src="js/mines.js"></script>
</body>
</html>
