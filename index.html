<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Sports - Apostas Esportivas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    colors: { 
                        brand: { 
                            primary: '#FF6B00', 
                            primaryHover: '#FF8533', 
                            dark: '#0A0A0A', 
                            card: '#1A1A1A', 
                            sidebar: '#121212', 
                            border: '#2D2D2D' 
                        } 
                    } 
                } 
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #2D2D2D; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #FF6B00; }
    </style>
</head>
<body class="bg-brand-dark text-white h-screen font-sans flex flex-col overflow-hidden">

    <!-- Top Header (Estilo Betano Clássico) -->
    <header class="bg-brand-sidebar border-b border-brand-border h-16 flex items-center justify-between px-6 z-50 shrink-0">
        <div class="flex items-center space-x-8">
            <span class="text-2xl font-black text-white tracking-wider uppercase flex items-center">
                <span class="bg-brand-primary text-white px-2.5 py-1 rounded-lg mr-2 italic font-black shadow-lg shadow-orange-600/30">REAL</span>SPORTS
            </span>
            <nav class="hidden md:flex items-center space-x-6 text-sm font-bold text-gray-300">
                <a href="#" onclick="switchTab('sports')" class="text-brand-primary hover:text-white transition-colors">INÍCIO</a>
                <a href="#" onclick="switchTab('sports')" class="hover:text-brand-primary transition-colors">AO VIVO</a>
                <a href="#" onclick="switchTab('sports')" class="hover:text-brand-primary transition-colors">PRÓXIMOS JOGOS</a>
                <a href="#" onclick="switchTab('mines')" class="hover:text-brand-primary transition-colors">CASSINO</a>
            </nav>
        </div>

        <!-- Barra de Pesquisa Centralizada -->
        <div class="hidden xl:flex items-center bg-brand-dark border border-brand-border rounded-full px-4 py-1.5 w-72">
            <i class="fa-solid fa-magnifying-glass text-gray-500 text-sm mr-2"></i>
            <input type="text" placeholder="Buscar times ou ligas..." class="bg-transparent text-xs text-white outline-none w-full placeholder-gray-500">
        </div>

        <div class="flex items-center space-x-3">
            <!-- Utilizador Logado -->
            <div id="user-logged-section" class="flex items-center space-x-3 hidden">
                <button onclick="openHistoryModal()" class="text-gray-400 hover:text-white px-2.5 py-1.5 text-xs font-bold flex items-center transition-colors bg-brand-card border border-brand-border rounded-lg">
                    <i class="fa-solid fa-clock-rotate-left mr-1.5 text-brand-primary"></i> Histórico
                </button>
                <div class="bg-brand-dark px-3 py-1.5 rounded-lg border border-brand-border flex items-center space-x-2">
                    <span id="user-balance" class="font-bold text-white text-sm">R$ 0,00</span>
                </div>
                <button onclick="openDepositModal()" class="bg-brand-primary hover:bg-brand-primaryHover text-white font-bold px-4 py-1.5 rounded-lg text-xs transition-colors shadow-lg uppercase tracking-wider">
                    Depositar
                </button>
                <button onclick="logout()" class="text-gray-400 hover:text-white p-2 text-sm" title="Sair da Conta">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>

            <!-- Visitante -->
            <div id="user-guest-section" class="flex items-center space-x-2">
                <button onclick="openAuthModal('login')" class="text-white hover:text-brand-primary font-bold px-4 py-2 text-xs transition-colors uppercase">Entrar</button>
                <button onclick="openAuthModal('signup')" class="bg-brand-primary hover:bg-brand-primaryHover text-white font-bold px-5 py-2 rounded-lg text-xs transition-colors uppercase shadow-lg shadow-orange-600/20">Registar</button>
            </div>
        </div>
    </header>

    <!-- Estrutura de 3 Colunas -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Coluna Esquerda: Menu de Esportes e Ligas -->
        <aside class="w-64 bg-brand-sidebar border-r border-brand-border hidden lg:flex flex-col overflow-y-auto">
            <div class="p-4">
                <h3 class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-3">Menu Principal</h3>
                <nav class="space-y-1">
                    <button onclick="switchTab('sports')" class="w-full flex items-center justify-between px-3 py-2.5 text-sm text-gray-300 hover:bg-brand-card hover:text-white rounded-lg transition-colors font-medium">
                        <span class="flex items-center"><i class="fa-solid fa-futbol text-brand-primary w-6"></i> Futebol</span>
                        <span class="text-xs bg-brand-dark px-2 py-0.5 rounded text-gray-500 border border-brand-border">70</span>
                    </button>
                    <button onclick="switchTab('mines')" class="w-full flex items-center justify-between px-3 py-2.5 text-sm text-gray-300 hover:bg-brand-card hover:text-white rounded-lg transition-colors font-medium">
                        <span class="flex items-center"><i class="fa-solid fa-bomb text-brand-primary w-6"></i> Real Mines</span>
                        <span class="text-xs bg-brand-primary/20 text-brand-primary px-2 py-0.5 rounded font-bold">HOT</span>
                    </button>
                </nav>
            </div>

            <div class="p-4 border-t border-brand-border">
                <h3 class="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-3">Competições em Destaque</h3>
                <nav class="space-y-1 text-xs">
                    <a href="#" class="flex items-center justify-between px-3 py-2 text-gray-400 hover:text-white hover:bg-brand-card rounded-lg transition-colors">
                        <span class="flex items-center"><span class="w-2 h-2 rounded-full bg-brand-primary mr-2"></span> Série A (Brasil)</span>
                        <span class="text-gray-500">10</span>
                    </a>
                    <a href="#" class="flex items-center justify-between px-3 py-2 text-gray-400 hover:text-white hover:bg-brand-card rounded-lg transition-colors">
                        <span class="flex items-center"><span class="w-2 h-2 rounded-full bg-blue-500 mr-2"></span> Copa do Brasil</span>
                        <span class="text-gray-500">4</span>
                    </a>
                    <a href="#" class="flex items-center justify-between px-3 py-2 text-gray-400 hover:text-white hover:bg-brand-card rounded-lg transition-colors">
                        <span class="flex items-center"><span class="w-2 h-2 rounded-full bg-purple-500 mr-2"></span> Champions League</span>
                        <span class="text-gray-500">8</span>
