<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Sports - Apostas Esportivas & Cassino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Supabase SDK Bundle -->
    <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { green: '#00E676', dark: '#0B0E14', card: '#151921', border: '#2A2E39' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-dark text-white min-h-screen font-sans flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-brand-card border-b border-brand-border sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <span class="text-2xl font-black text-brand-green tracking-wider uppercase">REAL<span class="text-white">SPORTS</span></span>

            <div class="flex items-center space-x-3">
                <div id="user-logged-section" class="flex items-center space-x-3 hidden">
                    <div class="bg-brand-dark px-3 py-1.5 rounded-lg border border-brand-border flex items-center space-x-2">
                        <span class="text-xs text-gray-400">Saldo:</span>
                        <span id="user-balance" class="font-bold text-brand-green">R$ 0,00</span>
                    </div>
                    <button onclick="logout()" class="text-gray-400 hover:text-white p-2 text-sm" title="Sair">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>

                <div id="user-guest-section" class="flex items-center space-x-2">
                    <button onclick="openAuthModal('login')" class="bg-brand-dark hover:border-brand-green border border-brand-border text-white font-bold px-4 py-2 rounded-lg text-sm">Entrar</button>
                    <button onclick="openAuthModal('signup')" class="bg-brand-green hover:bg-emerald-400 text-black font-bold px-4 py-2 rounded-lg text-sm">Cadastrar</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        <div class="bg-gradient-to-r from-emerald-900/40 to-brand-card p-6 rounded-2xl border border-brand-border">
            <span class="bg-brand-green text-black font-black text-xs px-2 py-1 rounded uppercase">Plataforma Ativa</span>
            <h2 class="text-2xl font-bold mt-2">Bem-vindo ao Real Sports</h2>
            <p class="text-gray-400 text-sm">Faça login ou cadastre-se para jogar.</p>
        </div>
    </main>

    <!-- Modal Autenticação -->
    <div id="auth-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-brand-card border border-brand-border rounded-2xl p-6 w-full max-w-sm space-y-4">
            <div class="flex justify-between items-center">
                <h3 id="auth-title" class="font-bold text-lg">Entrar</h3>
                <button onclick="closeAuthModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3">
                <div id="auth-name-container" class="hidden space-y-1">
                    <label class="text-xs text-gray-400">Nome Completo</label>
                    <input type="text" id="auth-name" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-white">
                </div>
                <div class="space-y-1">
                    <label class="text-xs text-gray-400">E-mail</label>
                    <input type="email" id="auth-email" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-white">
                </div>
                <div class="space-y-1">
                    <label class="text-xs text-gray-400">Senha</label>
                    <input type="password" id="auth-password" class="w-full bg-brand-dark border border-brand-border rounded-lg px-3 py-2 text-white">
                </div>
            </div>
            <button id="auth-submit-btn" onclick="submitAuth()" class="w-full bg-brand-green text-black font-bold py-2.5 rounded-lg">Entrar</button>
        </div>
    </div>

    <!-- Chamada dos Arquivos JS Separados -->
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
<!-- Chamada dos Arquivos JS Separados -->
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sports.js"></script>
    <script src="js/mines.js"></script>
</body>
